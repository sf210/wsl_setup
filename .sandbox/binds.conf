# Paths outside this project to expose inside the ./sbx sandbox.
#
#   MODE  SOURCE  [DEST]
#
# MODE is ro or rw. DEST defaults to SOURCE (same absolute path
# inside the sandbox); a relative DEST hangs off the project root.
# "~" is expanded. Paths containing spaces are not supported.
#
# Examples:
#   ro  /home/dad/data/prices.db
#   ro  /home/dad/data/prices.db  external/prices.db
#   rw  ~/shared/scratch
#
# This file is tracked in git — it documents what the project needs.
# Put machine-specific paths in binds.local.conf, which is ignored.

